# zipzom.cdd.co.kr 호스트 nginx 리버스 프록시.
# docker-compose.prod.yml의 web 컨테이너(127.0.0.1:8081)가 SPA 서빙 + /api → api 컨테이너 프록시를 맡는다.
#
# 설치:
#   sudo cp deploy/nginx/zipzom.cdd.co.kr.nginx.conf /etc/nginx/sites-available/zipzom.cdd.co.kr
#   sudo ln -s /etc/nginx/sites-available/zipzom.cdd.co.kr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 최초 TLS: 443 블록이 아직 없는 인증서를 참조하므로, 먼저 80 블록만으로 nginx를 띄운 뒤
#   sudo certbot certonly --webroot -w /var/www/certbot -d zipzom.cdd.co.kr
# 로 발급받고 이 파일 전체를 적용한다. (갱신은 certbot 타이머가 자동)

upstream zipzom_web {
    server 127.0.0.1:8081;
    keepalive 32;
}

# ---- HTTP: ACME 챌린지 + HTTPS 리다이렉트 ----
server {
    listen 80;
    server_name zipzom.cdd.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name zipzom.cdd.co.kr;

    ssl_certificate     /etc/letsencrypt/live/zipzom.cdd.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zipzom.cdd.co.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://zipzom_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        # 어드민 "지금 동기화"는 마이홈 수집 + LLM 추출로 수 분 걸릴 수 있음
        proxy_read_timeout    600s;
    }
}
