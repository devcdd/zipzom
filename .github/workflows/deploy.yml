# main push → self-hosted(arm64 EC2)에서 이미지 빌드·ghcr 푸시 → 같은 머신에서 compose 재기동.
# 서버 준비물: ~/zipzom/.env (.env.example "운영" 섹션). compose·schema는 이 workflow가 복사한다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: /home/ubuntu/zipzom

jobs:
  deploy:
    runs-on: [self-hosted, zipzom]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 경로 (ghcr 소유자는 소문자)
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "SHA_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: ghcr 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u "${{ github.actor }}" --password-stdin

      - name: api 이미지 빌드·푸시
        run: |
          IMG=$REGISTRY/$OWNER/zipzom-api
          docker build -f apps/api/Dockerfile -t $IMG:latest -t $IMG:$SHA_TAG .
          docker push $IMG:latest && docker push $IMG:$SHA_TAG

      - name: web 이미지 빌드·푸시
        run: |
          IMG=$REGISTRY/$OWNER/zipzom-web
          docker build -f apps/web/Dockerfile \
            --build-arg VITE_KAKAO_JS_KEY="${{ secrets.VITE_KAKAO_JS_KEY }}" \
            -t $IMG:latest -t $IMG:$SHA_TAG .
          docker push $IMG:latest && docker push $IMG:$SHA_TAG

      - name: 서버 .env 확인
        run: |
          test -f "$DEPLOY_DIR/.env" || { echo "::error::$DEPLOY_DIR/.env 없음. .env.example 운영 섹션 참고해 만들 것"; exit 1; }

      - name: compose·schema 복사
        run: |
          mkdir -p "$DEPLOY_DIR/db"
          cp docker-compose.prod.yml "$DEPLOY_DIR/"
          cp db/schema.sql "$DEPLOY_DIR/db/"

      - name: 재기동
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          GH_OWNER: ${{ env.OWNER }}
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f >/dev/null

      - name: 헬스체크
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/api/regions >/dev/null && { echo ok; exit 0; }
            sleep 2
          done
          echo "::error::api 응답 없음"; docker compose -f "$DEPLOY_DIR/docker-compose.prod.yml" logs --tail 50 api; exit 1
